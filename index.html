<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenRouter AI Chat</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --border: #cccccc;
    --panel: #f5f5f5;
    --bubble-user: #e6f0ff;
    --bubble-ai: #f0f0f0;
    --danger: #d33;
    --accent: #2a5adf;
  }
  body.dark {
    --bg: #121212;
    --text: #eeeeee;
    --border: #444444;
    --panel: #1e1e1e;
    --bubble-user: #2a3a5a;
    --bubble-ai: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 10px;
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  header h2 { margin: 0; font-size: 18px; flex: 1; }
  header .headerBtns { display: flex; gap: 6px; }
  header button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #sidebar {
    display: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: var(--panel);
    max-height: 260px;
    overflow-y: auto;
  }
  #sidebar.open { display: block; }
  #searchInput {
    width: 100%;
    padding: 6px 8px;
    margin-bottom: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .chatItem {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    gap: 4px;
  }
  .chatItem.active { font-weight: bold; }
  .chatItem .chatTitle {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chatItem button {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
  }
  .chatItem .delBtn { color: var(--danger); }
  #newChatBtn {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  #modelRow { margin-bottom: 8px; display: flex; gap: 8px; }
  #modelSelect {
    flex: 1;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  #exportBtn {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  #modeRow { margin-bottom: 8px; display: flex; gap: 6px; }
  .modeBtn {
    flex: 1;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }
  .modeBtn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #chatBox {
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 52vh;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 10px;
  }
  .msgRow { margin: 8px 0; display: flex; flex-direction: column; }
  .msgRow.user { align-items: flex-end; }
  .msgRow.ai { align-items: flex-start; }
  .msg {
    padding: 8px 10px;
    border-radius: 8px;
    max-width: 85%;
    white-space: pre-wrap;
  }
  .user .msg { background: var(--bubble-user); }
  .ai .msg { background: var(--bubble-ai); }
  .msg img {
    max-width: 100%;
    border-radius: 6px;
    margin-top: 6px;
    display: block;
  }
  .msgActions { margin-top: 2px; }
  .msgActions button {
    background: none;
    border: none;
    color: var(--text);
    opacity: 0.6;
    cursor: pointer;
    font-size: 12px;
  }
  .typing {
    font-style: italic;
    opacity: 0.7;
    font-size: 13px;
  }
  #imagePreviewWrap {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
  }
  #imagePreviewWrap.show { display: flex; }
  #imagePreviewWrap img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 6px;
  }
  #imagePreviewWrap .previewInfo { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #removeImageBtn {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 16px;
  }
  #inputArea { display: flex; gap: 8px; }
  #attachBtn {
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  #attachBtn:disabled { opacity: 0.4; cursor: not-allowed; }
  #userInput {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  #sendBtn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  footer {
    text-align: center;
    font-size: 12px;
    color: gray;
    margin-top: 12px;
  }
  #passwordOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  #passwordBox {
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    border-radius: 10px;
    width: 90%;
    max-width: 320px;
    text-align: center;
  }
  #passwordBox input {
    width: 100%;
    padding: 8px;
    margin: 10px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  #passwordBox button {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  #passwordError {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
  }
</style>
</head>
<body>

<div id="passwordOverlay">
  <div id="passwordBox">
    <h3>🔒 Masuk ke Chat</h3>
    <p style="font-size:13px;">Masukkan password untuk mengakses AI Chat ini.</p>
    <input type="password" id="passwordInput" placeholder="Password">
    <div id="passwordError"></div>
    <button onclick="submitPassword()">Masuk</button>
  </div>
</div>

<header>
  <button id="menuBtn" onclick="toggleSidebar()">☰</button>
  <h2>🤖 OpenRouter AI Chat</h2>
  <div class="headerBtns">
    <button id="logoutBtn" onclick="logout()" title="Logout">🚪</button>
    <button id="darkBtn" onclick="toggleDark()">🌙</button>
  </div>
</header>

<div id="sidebar">
  <button id="newChatBtn" onclick="newChat()">🆕 New Chat</button>
  <input type="text" id="searchInput" placeholder="🔍 Cari chat..." oninput="renderSidebar()">
  <div id="chatList"></div>
</div>

<div id="modelRow">
  <select id="modelSelect" onchange="onModelChange()">
    <option value="openai/gpt-4o-mini">OpenAI GPT-4o mini 📷</option>
    <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet 📷</option>
    <option value="google/gemini-flash-1.5">Gemini Flash 1.5 📷</option>
    <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (free)</option>
  </select>
  <button id="exportBtn" onclick="exportChat()">📤</button>
</div>

<div id="modeRow">
  <button id="chatModeBtn" class="modeBtn active" onclick="setMode('chat')">💬 Chat</button>
  <button id="imageModeBtn" class="modeBtn" onclick="setMode('image')">🎨 Generate Gambar</button>
</div>

<div id="chatBox"></div>

<div id="imagePreviewWrap">
  <img id="imagePreviewThumb" src="" alt="preview">
  <div class="previewInfo" id="imagePreviewName"></div>
  <button id="removeImageBtn" onclick="removeAttachedImage()">✖</button>
</div>

<div id="inputArea">
  <button id="attachBtn" onclick="document.getElementById('imageFileInput').click()" title="Lampirkan gambar (vision)">📎</button>
  <input type="file" id="imageFileInput" accept="image/*" style="display:none" onchange="onImageSelected(event)">
  <input type="text" id="userInput" placeholder="Ketik pesan...">
  <button id="sendBtn" onclick="handleSendClick()">Kirim</button>
</div>

<footer>Powered by Amos'rcpdroid86</footer>

<script>
let chats = {};
let activeChatId = null;
let chatPassword = null;
let currentMode = 'chat'; // 'chat' atau 'image'
let attachedImage = null; // { dataUrl, name }

// Model yang mendukung vision (upload gambar untuk ditanya ke AI)
const VISION_MODELS = new Set([
  'openai/gpt-4o-mini',
  'anthropic/claude-3.5-sonnet',
  'google/gemini-flash-1.5'
]);

function loadState() {
  const saved = localStorage.getItem('chats');
  chats = saved ? JSON.parse(saved) : {};
  activeChatId = localStorage.getItem('activeChatId');

  if (!activeChatId || !chats[activeChatId]) {
    if (Object.keys(chats).length > 0) {
      activeChatId = Object.keys(chats)[0];
    } else {
      createNewChatObject();
    }
  }

  const savedModel = localStorage.getItem('selectedModel');
  if (savedModel) document.getElementById('modelSelect').value = savedModel;

  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
  }

  chatPassword = localStorage.getItem('chatPassword');
  if (chatPassword) {
    document.getElementById('passwordOverlay').style.display = 'none';
  }
}

function submitPassword() {
  const val = document.getElementById('passwordInput').value.trim();
  if (!val) return;
  chatPassword = val;
  localStorage.setItem('chatPassword', val);
  document.getElementById('passwordError').textContent = '';
  document.getElementById('passwordInput').value = '';
  document.getElementById('passwordOverlay').style.display = 'none';
}

function logout() {
  if (!confirm('Keluar dari chat? Kamu perlu masukkan password lagi untuk lanjut chat (riwayat chat tetap tersimpan di perangkat ini).')) return;
  chatPassword = null;
  localStorage.removeItem('chatPassword');
  removeAttachedImage();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('passwordOverlay').style.display = 'flex';
  document.getElementById('passwordInput').focus();
}

document.getElementById('passwordInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') submitPassword();
});

function saveState() {
  localStorage.setItem('chats', JSON.stringify(chats));
  localStorage.setItem('activeChatId', activeChatId);
}

function createNewChatObject() {
  const id = 'chat_' + Date.now();
  chats[id] = { id: id, title: 'Chat baru', messages: [] };
  activeChatId = id;
  saveState();
}

function newChat() {
  createNewChatObject();
  removeAttachedImage();
  renderSidebar();
  renderMessages();
}

function deleteChat(id, event) {
  event.stopPropagation();
  if (!confirm('Hapus chat ini?')) return;
  delete chats[id];
  if (activeChatId === id) {
    const ids = Object.keys(chats);
    if (ids.length > 0) {
      activeChatId = ids[0];
    } else {
      createNewChatObject();
    }
  }
  saveState();
  renderSidebar();
  renderMessages();
}

function renameChat(id, event) {
  event.stopPropagation();
  const newTitle = prompt('Ganti nama chat:', chats[id].title);
  if (newTitle && newTitle.trim()) {
    chats[id].title = newTitle.trim().slice(0, 40);
    saveState();
    renderSidebar();
  }
}

function switchChat(id) {
  activeChatId = id;
  saveState();
  removeAttachedImage();
  renderSidebar();
  renderMessages();
  document.getElementById('sidebar').classList.remove('open');
}

// Ambil teks polos dari sebuah pesan, untuk search & export (pesan bisa berisi teks + gambar)
function getMessageText(m) {
  return m.text || '';
}

function renderSidebar() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  const query = (document.getElementById('searchInput').value || '').toLowerCase();

  Object.values(chats).reverse().forEach(chat => {
    const matchTitle = chat.title.toLowerCase().includes(query);
    const matchContent = chat.messages.some(m => getMessageText(m).toLowerCase().includes(query));
    if (query && !matchTitle && !matchContent) return;

    const div = document.createElement('div');
    div.className = 'chatItem' + (chat.id === activeChatId ? ' active' : '');
    div.onclick = () => switchChat(chat.id);

    const span = document.createElement('span');
    span.className = 'chatTitle';
    span.textContent = chat.title;
    div.appendChild(span);

    const renameBtn = document.createElement('button');
    renameBtn.textContent = '✏️';
    renameBtn.onclick = (e) => renameChat(chat.id, e);
    div.appendChild(renameBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'delBtn';
    delBtn.textContent = '🗑️';
    delBtn.onclick = (e) => deleteChat(chat.id, e);
    div.appendChild(delBtn);

    list.appendChild(div);
  });
}

function renderMessages() {
  const chatBox = document.getElementById('chatBox');
  chatBox.innerHTML = '';
  const chat = chats[activeChatId];
  if (!chat) return;
  chat.messages.forEach(m => {
    addMessageToBox(m.role, m.text || '', false, m.images || []);
  });
  chatBox.scrollTop = chatBox.scrollHeight;
}

function addMessageToBox(role, text, scroll = true, images = []) {
  const chatBox = document.getElementById('chatBox');
  const row = document.createElement('div');
  row.className = 'msgRow ' + (role === 'user' ? 'user' : 'ai');

  const bubble = document.createElement('div');
  bubble.className = 'msg';
  bubble.textContent = text;
  images.forEach(url => {
    const img = document.createElement('img');
    img.src = url;
    bubble.appendChild(img);
  });
  row.appendChild(bubble);

  if (role !== 'user') {
    const actions = document.createElement('div');
    actions.className = 'msgActions';
    const copyBtn = document.createElement('button');
    copyBtn.textContent = '📋 Copy';
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(bubble.firstChild ? bubble.firstChild.textContent || text : text);
      copyBtn.textContent = '✅ Disalin';
      setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 1500);
    };
    actions.appendChild(copyBtn);
    row.appendChild(actions);
  }

  chatBox.appendChild(row);
  if (scroll) chatBox.scrollTop = chatBox.scrollHeight;
  return bubble;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', document.body.classList.contains('dark'));
}

function onModelChange() {
  localStorage.setItem('selectedModel', document.getElementById('modelSelect').value);
}

function setMode(newMode) {
  currentMode = newMode;
  document.getElementById('chatModeBtn').classList.toggle('active', newMode === 'chat');
  document.getElementById('imageModeBtn').classList.toggle('active', newMode === 'image');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const attachBtn = document.getElementById('attachBtn');
  if (newMode === 'image') {
    input.placeholder = 'Deskripsikan gambar yang ingin dibuat...';
    sendBtn.textContent = 'Buat';
    attachBtn.disabled = true;
    removeAttachedImage();
  } else {
    input.placeholder = 'Ketik pesan...';
    sendBtn.textContent = 'Kirim';
    attachBtn.disabled = false;
  }
}

function onImageSelected(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;

  if (!VISION_MODELS.has(document.getElementById('modelSelect').value)) {
    alert('Model yang dipilih tidak mendukung gambar (vision). Pilih GPT-4o mini, Claude 3.5 Sonnet, atau Gemini Flash 1.5 dulu.');
    return;
  }
  if (file.size > 4 * 1024 * 1024) {
    alert('Ukuran gambar terlalu besar (maks ±4MB). Coba gambar yang lebih kecil.');
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    attachedImage = { dataUrl: reader.result, name: file.name };
    document.getElementById('imagePreviewThumb').src = reader.result;
    document.getElementById('imagePreviewName').textContent = file.name;
    document.getElementById('imagePreviewWrap').classList.add('show');
  };
  reader.readAsDataURL(file);
}

function removeAttachedImage() {
  attachedImage = null;
  document.getElementById('imagePreviewWrap').classList.remove('show');
  document.getElementById('imagePreviewThumb').src = '';
}

function exportChat() {
  const chat = chats[activeChatId];
  if (!chat || chat.messages.length === 0) {
    alert('Belum ada percakapan untuk diexport.');
    return;
  }
  let text = 'Chat: ' + chat.title + '\n\n';
  chat.messages.forEach(m => {
    const who = m.role === 'user' ? 'Kamu' : 'AI';
    const imgNote = (m.images && m.images.length) ? ' [gambar terlampir]' : '';
    text += who + ': ' + getMessageText(m) + imgNote + '\n\n';
  });
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = chat.title.replace(/[^a-z0-9]/gi, '_') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function canSendNow() {
  const now = Date.now();
  let timestamps = JSON.parse(localStorage.getItem('msgTimestamps') || '[]');
  timestamps = timestamps.filter(t => now - t < 60000);
  if (timestamps.length >= 15) {
    return false;
  }
  timestamps.push(now);
  localStorage.setItem('msgTimestamps', JSON.stringify(timestamps));
  return true;
}

function handleSendClick() {
  if (currentMode === 'image') {
    generateImage();
  } else {
    sendMessage();
  }
}

// Bangun payload `messages` gaya OpenAI untuk dikirim ke backend,
// termasuk multi-part content kalau ada gambar (vision).
function buildApiMessages(chat) {
  return chat.messages
    .filter(m => !m.isImageGen) // hasil generate-gambar tidak dikirim balik sebagai konteks chat teks
    .map(m => {
      if (m.images && m.images.length > 0) {
        const parts = [{ type: 'text', text: m.text || '' }];
        m.images.forEach(url => parts.push({ type: 'image_url', image_url: { url } }));
        return { role: m.role, content: parts };
      }
      return { role: m.role, content: m.text || '' };
    });
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text && !attachedImage) return;

  if (!chatPassword) {
    document.getElementById('passwordOverlay').style.display = 'flex';
    return;
  }

  if (!canSendNow()) {
    alert('Terlalu banyak pesan dalam waktu singkat. Tunggu sebentar ya.');
    return;
  }

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  const chat = chats[activeChatId];
  const userImages = attachedImage ? [attachedImage.dataUrl] : [];
  const userMsg = { role: 'user', text: text, images: userImages };
  chat.messages.push(userMsg);
  if (chat.title === 'Chat baru') {
    chat.title = (text || '📷 Gambar').slice(0, 30);
  }
  addMessageToBox('user', text, true, userImages);
  input.value = '';
  removeAttachedImage();
  saveState();
  renderSidebar();

  const model = document.getElementById('modelSelect').value;
  const aiBubble = addMessageToBox('ai', '');
  aiBubble.classList.add('typing');
  aiBubble.textContent = 'AI sedang mengetik...';
  let aiText = '';
  let firstChunk = true;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: buildApiMessages(chat), model: model, stream: true, password: chatPassword })
    });

    if (response.status === 401) {
      aiBubble.classList.remove('typing');
      aiBubble.textContent = 'Password salah. Silakan masukkan ulang.';
      localStorage.removeItem('chatPassword');
      chatPassword = null;
      document.getElementById('passwordOverlay').style.display = 'flex';
      document.getElementById('passwordError').textContent = 'Password salah, coba lagi.';
      return;
    }

    if (!response.ok || !response.body) {
      aiBubble.classList.remove('typing');
      aiBubble.textContent = 'Terjadi error saat menghubungi server. Coba lagi beberapa saat.';
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
          if (delta) {
            if (firstChunk) {
              aiBubble.classList.remove('typing');
              firstChunk = false;
            }
            aiText += delta;
            aiBubble.textContent = aiText;
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
          }
        } catch (e) {}
      }
    }

    if (!aiText) {
      aiBubble.classList.remove('typing');
      aiBubble.textContent = 'AI tidak memberikan balasan. Coba kirim ulang pesan.';
    } else {
      chat.messages.push({ role: 'assistant', text: aiText, images: [] });
      saveState();
    }

  } catch (err) {
    aiBubble.classList.remove('typing');
    if (err instanceof TypeError) {
      aiBubble.textContent = 'Tidak bisa terhubung ke server. Periksa koneksi internet kamu.';
    } else {
      aiBubble.textContent = 'Terjadi kesalahan: ' + err.message;
    }
  } finally {
    sendBtn.disabled = false;
  }
}

async function generateImage() {
  const input = document.getElementById('userInput');
  const prompt = input.value.trim();
  if (!prompt) return;

  if (!chatPassword) {
    document.getElementById('passwordOverlay').style.display = 'flex';
    return;
  }

  if (!canSendNow()) {
    alert('Terlalu banyak permintaan dalam waktu singkat. Tunggu sebentar ya.');
    return;
  }

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  const chat = chats[activeChatId];
  chat.messages.push({ role: 'user', text: prompt, images: [] });
  if (chat.title === 'Chat baru') {
    chat.title = ('🎨 ' + prompt).slice(0, 30);
  }
  addMessageToBox('user', prompt);
  input.value = '';
  saveState();
  renderSidebar();

  const aiBubble = addMessageToBox('ai', '');
  aiBubble.classList.add('typing');
  aiBubble.textContent = 'Membuat gambar...';

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'image', prompt: prompt, password: chatPassword })
    });

    if (response.status === 401) {
      aiBubble.classList.remove('typing');
      aiBubble.textContent = 'Password salah. Silakan masukkan ulang.';
      localStorage.removeItem('chatPassword');
      chatPassword = null;
      document.getElementById('passwordOverlay').style.display = 'flex';
      document.getElementById('passwordError').textContent = 'Password salah, coba lagi.';
      return;
    }

    const data = await response.json();

    if (!response.ok) {
      aiBubble.classList.remove('typing');
      aiBubble.textContent = 'Gagal membuat gambar: ' + (data.error || 'error tidak diketahui');
      return;
    }

    const images = data.images || [];
    if (images.length === 0) {
      aiBubble.classList.remove('typing');
      aiBubble.textContent = data.text || 'Model tidak mengembalikan gambar. Coba model image-generation lain lewat env var IMAGE_MODEL.';
      chat.messages.push({ role: 'assistant', text: aiBubble.textContent, images: [], isImageGen: true });
      saveState();
      return;
    }

    aiBubble.classList.remove('typing');
    aiBubble.textContent = data.text || '';
    images.forEach(url => {
      const img = document.createElement('img');
      img.src = url;
      aiBubble.appendChild(img);
    });

    chat.messages.push({ role: 'assistant', text: data.text || '', images: images, isImageGen: true });
    saveState();

  } catch (err) {
    aiBubble.classList.remove('typing');
    if (err instanceof TypeError) {
      aiBubble.textContent = 'Tidak bisa terhubung ke server. Periksa koneksi internet kamu.';
    } else {
      aiBubble.textContent = 'Terjadi kesalahan: ' + err.message;
    }
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById('userInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') handleSendClick();
});

loadState();
renderSidebar();
renderMessages();
</script>

</body>
</html>
