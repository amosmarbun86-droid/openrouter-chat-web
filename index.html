<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenRouter AI Chat</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 10px;
  }
  #chatBox {
    border: 1px solid #ccc;
    border-radius: 8px;
    height: 60vh;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 10px;
  }
  .msg { margin: 8px 0; }
  .user { font-weight: bold; }
  .ai { color: #333; }
  #inputArea {
    display: flex;
    gap: 8px;
  }
  #userInput {
    flex: 1;
    padding: 8px;
  }
  button {
    padding: 8px 16px;
  }
</style>
</head>
<body>

<h2>🤖 OpenRouter AI Chat</h2>
<div id="chatBox"></div>
<div id="inputArea">
  <input type="text" id="userInput" placeholder="Ketik pesan...">
  <button onclick="sendMessage()">Kirim</button>
</div>

<script>
let messages = [];

async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text) return;

  addMessageToBox("Kamu", text);
  messages.push({ role: "user", content: text });
  input.value = "";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages })
    });

    const data = await response.json();

    if (!response.ok) {
      addMessageToBox("AI", "Terjadi error: " + JSON.stringify(data));
      return;
    }

    const answer = data.choices[0].message.content;
    addMessageToBox("AI", answer);
    messages.push({ role: "assistant", content: answer });

  } catch (err) {
    addMessageToBox("AI", "Error: " + err.message);
  }
}

function addMessageToBox(sender, text) {
  const chatBox = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = "msg " + (sender === "Kamu" ? "user" : "ai");
  div.textContent = sender + ": " + text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById("userInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
