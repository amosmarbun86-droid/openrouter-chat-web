<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenRouter AI Chat</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --border: #cccccc;
    --panel: #f5f5f5;
    --bubble-user: #e6f0ff;
    --bubble-ai: #f0f0f0;
  }
  body.dark {
    --bg: #121212;
    --text: #eeeeee;
    --border: #444444;
    --panel: #1e1e1e;
    --bubble-user: #2a3a5a;
    --bubble-ai: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 10px;
    background: var(--bg);
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  header h2 { margin: 0; font-size: 18px; flex: 1; }
  header button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #sidebar {
    display: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    background: var(--panel);
    max-height: 200px;
    overflow-y: auto;
  }
  #sidebar.open { display: block; }
  .chatItem {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .chatItem.active { font-weight: bold; }
  .chatItem button {
    background: none;
    border: none;
    color: #d33;
    cursor: pointer;
    font-size: 16px;
  }
  #newChatBtn {
    width: 100%;
    padding: 8px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  #modelRow { margin-bottom: 8px; }
  #modelSelect {
    width: 100%;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  #chatBox {
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 55vh;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 10px;
  }
  .msg {
    margin: 8px 0;
    padding: 8px 10px;
    border-radius: 8px;
    max-width: 85%;
    white-space: pre-wrap;
  }
  .user { background: var(--bubble-user); margin-left: auto; }
  .ai { background: var(--bubble-ai); margin-right: auto; }
  #inputArea { display: flex; gap: 8px; }
  #userInput {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  #sendBtn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <button id="menuBtn" onclick="toggleSidebar()">☰</button>
  <h2>🤖 OpenRouter AI Chat</h2>
  <button id="darkBtn" onclick="toggleDark()">🌙</button>
</header>

<div id="sidebar">
  <button id="newChatBtn" onclick="newChat()">🆕 New Chat</button>
  <div id="chatList"></div>
</div>

<div id="modelRow">
  <select id="modelSelect" onchange="onModelChange()">
    <option value="openai/gpt-4o-mini">OpenAI GPT-4o mini</option>
    <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
    <option value="google/gemini-flash-1.5">Gemini Flash 1.5</option>
    <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3.1 8B (free)</option>
  </select>
</div>

<div id="chatBox"></div>
<div id="inputArea">
  <input type="text" id="userInput" placeholder="Ketik pesan...">
  <button id="sendBtn" onclick="sendMessage()">Kirim</button>
</div>
<p style="text-align:center; font-size:12px; color:gray; margin-top:12px;">
  Powered by Amos'rcpdroid86
</p>

<script>
let chats = {};
let activeChatId = null;

function loadState() {
  const saved = localStorage.getItem('chats');
  chats = saved ? JSON.parse(saved) : {};
  activeChatId = localStorage.getItem('activeChatId');

  if (!activeChatId || !chats[activeChatId]) {
    if (Object.keys(chats).length > 0) {
      activeChatId = Object.keys(chats)[0];
    } else {
      createNewChatObject();
    }
  }

  const savedModel = localStorage.getItem('selectedModel');
  if (savedModel) document.getElementById('modelSelect').value = savedModel;

  if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark');
  }
}

function saveState() {
  localStorage.setItem('chats', JSON.stringify(chats));
  localStorage.setItem('activeChatId', activeChatId);
}

function createNewChatObject() {
  const id = 'chat_' + Date.now();
  chats[id] = { id: id, title: 'Chat baru', messages: [] };
  activeChatId = id;
  saveState();
}

function newChat() {
  createNewChatObject();
  renderSidebar();
  renderMessages();
}

function deleteChat(id, event) {
  event.stopPropagation();
  if (!confirm('Hapus chat ini?')) return;
  delete chats[id];
  if (activeChatId === id) {
    const ids = Object.keys(chats);
    if (ids.length > 0) {
      activeChatId = ids[0];
    } else {
      createNewChatObject();
    }
  }
  saveState();
  renderSidebar();
  renderMessages();
}

function switchChat(id) {
  activeChatId = id;
  saveState();
  renderSidebar();
  renderMessages();
  document.getElementById('sidebar').classList.remove('open');
}

function renderSidebar() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  Object.values(chats).reverse().forEach(chat => {
    const div = document.createElement('div');
    div.className = 'chatItem' + (chat.id === activeChatId ? ' active' : '');
    div.onclick = () => switchChat(chat.id);

    const span = document.createElement('span');
    span.textContent = chat.title;
    div.appendChild(span);

    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑️';
    delBtn.onclick = (e) => deleteChat(chat.id, e);
    div.appendChild(delBtn);

    list.appendChild(div);
  });
}

function renderMessages() {
  const chatBox = document.getElementById('chatBox');
  chatBox.innerHTML = '';
  const chat = chats[activeChatId];
  if (!chat) return;
  chat.messages.forEach(m => {
    addMessageToBox(m.role, m.content, false);
  });
  chatBox.scrollTop = chatBox.scrollHeight;
}

function addMessageToBox(role, text, scroll = true) {
  const chatBox = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  div.textContent = text;
  chatBox.appendChild(div);
  if (scroll) chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', document.body.classList.contains('dark'));
}

function onModelChange() {
  localStorage.setItem('selectedModel', document.getElementById('modelSelect').value);
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  const chat = chats[activeChatId];
  chat.messages.push({ role: 'user', content: text });
  if (chat.title === 'Chat baru') {
    chat.title = text.slice(0, 30);
  }
  addMessageToBox('user', text);
  input.value = '';
  saveState();
  renderSidebar();

  const model = document.getElementById('modelSelect').value;
  const aiDiv = addMessageToBox('ai', '');
  let aiText = '';

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chat.messages, model: model, stream: true })
    });

    if (!response.ok || !response.body) {
      const errData = await response.json().catch(() => ({}));
      aiDiv.textContent = 'Terjadi error: ' + JSON.stringify(errData);
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const payload = trimmed.slice(5).trim();
        if (payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
          if (delta) {
            aiText += delta;
            aiDiv.textContent = aiText;
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
          }
        } catch (e) {}
      }
    }

    chat.messages.push({ role: 'assistant', content: aiText });
    saveState();

  } catch (err) {
    aiDiv.textContent = 'Error: ' + err.message;
  }
}

document.getElementById('userInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendMessage();
});

loadState();
renderSidebar();
renderMessages();
</script>

</body>
</html>
